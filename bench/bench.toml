# Bench definition for rustyfarian-bench (`just bench <target>`).
# Scenarios live in bench/<board>/*.toml; see bench/README.md.

[commands]
build = ["just", "build-example", "{example}"]
flash = ["just", "flash", "{example}", "{port}"]

[boards.s3]
chip = "esp32s3"
name = "CrowPanel 1.28\" HMI (ESP32-S3)"

[boards.c3]
chip = "esp32c3"
name = "ESP32-C3 SuperMini"

[boards.c6]
chip = "esp32c6"
name = "ESP32-C6-DevKitC-1"

[boards.esp32]
chip = "esp32"
name = "ESP32-WROOM-32 DevKit (board profile esp32-wroom)"

# Same chip as `esp32`, built with the Feather V2 board profile (ADR-014): I2C on the
# STEMMA QT socket (SDA 22 / SCL 20) with its power switched on via GPIO 2.
# With both boards attached, pin each one's `mac` so the runner picks the right port.
[boards.esp32-feather]
chip = "esp32"
name = "Adafruit ESP32 Feather V2 (board profile feather-v2)"
build = ["just", "build-example", "{example}", "feather-v2"]
flash = ["just", "flash", "{example}", "{port}", "feather-v2"]
