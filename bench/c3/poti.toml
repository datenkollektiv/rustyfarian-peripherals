# Potentiometer wiper on ADC1 GPIO 4: 5 s end-to-end calibration, then normalized readings, both tiers.
# Lines look like `raw=2048 normalized=512 percent=50%` and appear only when the value moves past the deadband.
examples = ["hal_c3_poti", "idf_c3_poti"]

[[step]]
say = "Wait for the first sample and the calibration prompt"
expect = ['Waiting for first ADC sample on GPIO 4', 'Calibration: turn the potentiometer']
reject = 'ADC read failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT'
timeout = 15
optional = true
arm = false

# The firmware's 5 s calibration window opens at boot, so Enter resets the board:
# the window starts when the operator is ready, and a retry really retries.
# Percentages are relative to the sweep, so the raw span itself must reach both rails;
# a squeezed range (e.g. the old esp-hal init-code bug, or a resistor in a leg) fails here.
# The in-band pattern wins over the catch-all `Calibration raw` reject.
[[step]]
say = "Turn the potentiometer end-to-end, back and forth, for 5 s"
attended = true
reset = true
expect = [
    'Calibration accepted; using calibrated range',
    'Calibration raw min=Some\((?:\d|\d\d|1\d\d)\) max=Some\((?:39\d\d|40\d\d)\)',
]
reject = 'falling back|Calibration raw|ADC read failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT'
timeout = 20

# Unattended, nobody turns the knob, so the firmware falls back to the full range first.
[[step]]
say = "Wait for the ready line"
expect = 'Potentiometer ready on GPIO 4: raw=\d+ normalized=\d+ percent=\d+%'
reject = 'ADC read failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT'
timeout = 15
arm = false

# Each position is reached, then held: a sample passing through the band on the way is not enough.
[[step]]
say = "Turn the potentiometer to the end where it reads about 0 percent and let go"
attended = true
expect = '^(?!.*Potentiometer ready).*percent=[0-4]%'
reject = 'ADC read failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT'
timeout = 20
arm = false

[[step]]
say = "Leave it there"
attended = true
duration = 2
reject = 'percent=(?:[5-9]|[1-9]\d|100)%|ADC read failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT|ESP-ROM:|rst:0x'
arm = false

[[step]]
say = "Turn it to the other end, about 100 percent, and let go"
attended = true
expect = 'percent=(?:9[6-9]|100)%'
reject = 'ADC read failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT'
timeout = 20
arm = false

[[step]]
say = "Leave it there"
attended = true
duration = 2
reject = 'percent=(?:\d|[1-8]\d|9[0-5])%|ADC read failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT|ESP-ROM:|rst:0x'
arm = false

[[step]]
say = "Turn it to about the middle and let go"
attended = true
expect = 'percent=(?:4\d|5\d|6[0-5])%'
reject = 'ADC read failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT'
timeout = 20
arm = false

[[step]]
say = "Leave it there"
attended = true
duration = 2
reject = 'percent=(?:\d|[1-3]\d|6[6-9]|[7-9]\d|100)%|ADC read failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT|ESP-ROM:|rst:0x'
arm = false

[[step]]
say = "Hands off: the firmware keeps running for 5 s"
duration = 5
reject = 'PANIC|panicked at|ADC read failed|Guru Meditation|abort\(\)|WDT|ESP-ROM:|rst:0x'
arm = false
