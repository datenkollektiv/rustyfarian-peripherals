# BME680 under embassy: esp-hal I2c in Async mode, same readings as the blocking twin (hal only, no idf twin).
examples = ["hal_c3_bme680_async"]

[[step]]
say = "Wait for the banner"
expect = 'BME680 OK at address 0x76'
timeout = 15
optional = true
arm = false

[[step]]
say = "Leave the sensor alone: two plausible readings (10-39 degC, 900-1100 hPa)"
expect = ['T: [1-3]\d\.\d degC  P: (?:9|10)\d\d\.\d hPa  RH: \d+\.\d %', 'T: [1-3]\d\.\d degC  P: (?:9|10)\d\d\.\d hPa  RH: \d+\.\d %']
reject = 'no BME680|bus fault|measurement failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT'
timeout = 30
arm = false

[[step]]
say = "Wait for a valid gas reading (heater stable)"
expect = 'gas: \d+ ohm'
reject = 'no BME680|bus fault|measurement failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT'
timeout = 90
arm = false

[[step]]
say = "Let it run for 20 s: readings keep arriving every few seconds without errors"
duration = 20
reject = 'no BME680|bus fault|measurement failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT|ESP-ROM:|rst:0x'
arm = false

[[step]]
say = "Compare with the blocking twin"
confirm = "Do the temperature, pressure and humidity match what hal_c3_bme680 reported?"
