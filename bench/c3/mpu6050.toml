# MPU6050 (GY-521, AD0 low = 0x68) on the shared I2C pogo header: calibration, then tilt about the X axis, both tiers.
# Calibration assumes Z up (+1 g): an upside-down boot stores z near -32768 and caps every tilt at about 26 degrees,
# so the calibration step requires |z| below 10000 counts.
# Each position is reached, then held: one sample swept through the band is not enough.
# No step waits for Enter: each passes as soon as its line arrives.
# A wrong address (AD0 high without I2C_ADDR_ALT) prints the AD0 hint instead; that needs a rebuild, see README.md.
examples = ["hal_c3_mpu6050_tilt", "idf_c3_mpu6050_tilt"]

[[step]]
say = "Wait for the banner and the calibration (sensor flat and still, MPU6050 chip facing up; on a GY-521 the header pins point down)"
expect = ['MPU6050 WHO_AM_I OK \(0x68\) at address 0x68', 'calibrating', 'offsets: AccelOffsets \{ y: -?\d+, z: -?\d{1,4} \}']
reject = 'no MPU6050|bus fault|calibration failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT'
timeout = 60
arm = false

[[step]]
say = "Keep it level: the tilt reads about 0 degrees"
expect = 'tilt: -?[0-4]\.\d°'
reject = 'read failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT'
timeout = 15
arm = false

[[step]]
say = "Tip the sensor about the X axis to the side that reads positive, about +90 degrees, and hold"
attended = true
expect = 'tilt: [7-9]\d\.\d°'
reject = 'read failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT'
timeout = 60
arm = false

[[step]]
say = "Hold it at +90 degrees"
attended = true
duration = 2
reject = 'tilt: (?!(?:[7-9]\d|10\d)\.\d°)|read failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT|ESP-ROM:|rst:0x'
arm = false

[[step]]
say = "Tip it to the other side, about -90 degrees, and hold"
attended = true
expect = 'tilt: -[7-9]\d\.\d°'
reject = 'read failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT'
timeout = 60
arm = false

[[step]]
say = "Hold it at -90 degrees"
attended = true
duration = 2
reject = 'tilt: (?!-(?:[7-9]\d|10\d)\.\d°)|read failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT|ESP-ROM:|rst:0x'
arm = false

[[step]]
say = "Put it back level"
attended = true
expect = 'tilt: -?[0-4]\.\d°'
reject = 'read failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT'
timeout = 60
arm = false

[[step]]
say = "Keep it level and still for 5 s"
attended = true
duration = 5
reject = 'tilt: (?!-?[0-4]\.\d°)|read failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT|ESP-ROM:|rst:0x'
arm = false
