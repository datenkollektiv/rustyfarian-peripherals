# SHT3x (SHT31) on the shared I2C pogo header (SDA GPIO 6, SCL GPIO 7, ADDR low = address 0x44), blocking driver, both tiers.
# Prints `T: 23.45 degC  RH: 41.20 %`; a wrong address prints an ADDR hint and needs a rebuild with I2C_ADDR_ALT (not a bench step).
# The breath step is armed (Enter, then act) and log-judged: a reading of 70 %RH or more within 30 s; a room already above 70 %RH passes it trivially.
# `c6/sht3x` mirrors these steps; a fix to one scenario applies to the other.
examples = ["hal_c3_sht3x", "idf_c3_sht3x"]

[[step]]
say = "Wait for the banner"
expect = 'SHT3x OK at address 0x44, status 0x[0-9A-F]{4}'
reject = 'no SHT3x|bus fault|SHT3x init failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT'
timeout = 15
optional = true
arm = false

[[step]]
say = "Leave the sensor alone: two plausible readings (10-39 degC, 0-100 %RH)"
expect = ['T: [1-3]\d\.\d\d degC  RH: \d+\.\d\d %', 'T: [1-3]\d\.\d\d degC  RH: \d+\.\d\d %']
reject = 'no SHT3x|bus fault|SHT3x init failed|measurement failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT'
timeout = 30
arm = false

[[step]]
say = "Breathe gently on the sensor: the bench waits for a reading of 70 %RH or more"
attended = true
expect = 'RH: (?:[7-9]\d|100)\.\d\d %'
reject = 'measurement failed|PANIC|panicked|Guru Meditation|abort\(\)|WDT'
timeout = 30
