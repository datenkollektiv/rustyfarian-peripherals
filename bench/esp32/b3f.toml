# b3f smoke: debounced GPIO 4 input (a B3F button to GND) + console, both tiers.
# No step waits for Enter: each shows its instruction and passes as soon as its lines arrive (60 s).
examples = ["hal_esp32_b3f", "idf_esp32_b3f"]

[[step]]
say = "Wait for the banner"
expect = "B3F button ready on GPIO 4"
timeout = 10
optional = true   # can be printed before the port reopens after reset
arm = false       # must read the backlog from the reset

[[step]]
say = "Hands off: the firmware keeps running for 5 s"
duration = 5
reject = 'PANIC|panicked at|Guru Meditation|abort\(\) was called|WDT|ESP-ROM:|rst:0x'
arm = false

[[step]]
say = "Press the button 3 times, then keep your hands off for 2 s"
attended = true
expect = ["pressed", "released", "pressed", "released", "pressed", "released"]
# First step of an --attended run, so it reads the boot banner: no reboot markers (ESP-ROM:, rst:0x) in the reject.
reject = 'pressed|released|PANIC|panicked|Guru Meditation|abort\(\)|WDT'
timeout = 60
settle = 2
arm = false
