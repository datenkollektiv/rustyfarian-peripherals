# ISR decode under a 90 ms blocking redraw (hal only); IDF decodes in its ISR already (rotary.toml).
# A window closes 1.5 s after the last detent:
# `WINDOW 1 isr work_ms=90 cw=10 ccw=0 delta=10 pos=10 edges=40 skipped=0 isrs=.. redraws=..`
# The invariant is `skipped=0` over a window of at least 10 detents; a pause only splits the turn into
# smaller windows, which are ignored, and edges are not checked (contact bounce adds a few per detent).
# Only WINDOW lines are judged for skips: HB carries the cumulative count, so one skip would fail
# every later step; the closing HB step proves the idle firmware opens no window.
# No step waits for Enter: each shows its instruction and passes as soon as its line arrives.
examples = ["hal_s3_rotary_isr"]

[[step]]
say = "Wait for the banner"
expect = "ISR encoder work_ms=90"
timeout = 10
optional = true
arm = false

[[step]]
say = "Turn at least 10 detents clockwise without pausing, then stop for 2 s"
attended = true
expect = 'WINDOW \d+ .* cw=[1-9]\d+ ccw=0 .*skipped=0 '
reject = 'WINDOW .*skipped=[1-9]|PANIC'
timeout = 60
arm = false

[[step]]
say = "Turn at least 10 detents counter-clockwise without pausing, then stop for 2 s"
attended = true
expect = 'WINDOW \d+ .* cw=0 ccw=[1-9]\d+ .*skipped=0 '
reject = 'WINDOW .*skipped=[1-9]|PANIC'
timeout = 60
arm = false

[[step]]
say = "Spin fast but not flat out (about one turn, any direction), then stop for 2 s"
attended = true
expect = 'WINDOW \d+ .* delta=-?[1-9]\d+ .*skipped=0 '
reject = 'WINDOW .*skipped=[1-9]|PANIC'
timeout = 60
arm = false

[[step]]
say = "Leave the knob alone until the 10 s heartbeat"
expect = 'HB pos=-?\d+ edges=\d+ skipped=\d+ '
reject = 'WINDOW|PANIC'
timeout = 15
arm = false

