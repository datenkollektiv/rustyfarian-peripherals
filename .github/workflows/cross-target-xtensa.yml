name: Cross-target Xtensa

# Gates the bare-metal esp-hal tier on the two Xtensa chips: classic ESP32 (WROOM-32 /
# Feather V2) and ESP32-S3. `just ci-xtensa` runs `check` and `clippy -D warnings` on the
# library for each chip, then links each chip's b3f smoke example.
# This is the most expensive of the cross-target jobs — it installs the Xtensa Rust fork
# via espup — hence the path filter and the toolchain cache.
#
# ROLE: a compile gate for *our source*, and a forward-compatibility canary for the
# *toolchain*. The distinction matters when it goes red:
#   - red after a change to this repo  -> treat as a normal blocking failure
#   - red with no relevant source change -> upstream toolchain moved; investigate before
#     assuming the PR is at fault, and consider pinning back.
#
# XTENSA_VERSION is the family toolchain pin (rustyfarian-ci CONVENTIONS.md). It must stay in
# the cache key below, so a toolchain bump never restores a stale esp toolchain.

# NOTE: the push and pull_request `paths:` lists below are duplicated and must stay in
# sync. GitHub Actions does not support YAML anchors/aliases, so this cannot be factored out.
on:
  push:
    branches: ["main"]
    paths:
      - "crates/rustyfarian-esp-hal-peripherals/**"
      - "crates/tamer/**"
      - "scripts/**"
      - ".cargo/config.toml"
      - "Cargo.toml"
      - "justfile"
      - ".github/workflows/cross-target-xtensa.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "crates/rustyfarian-esp-hal-peripherals/**"
      - "crates/tamer/**"
      - "scripts/**"
      - ".cargo/config.toml"
      - "Cargo.toml"
      - "justfile"
      - ".github/workflows/cross-target-xtensa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-xtensa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  XTENSA_VERSION: "1.97.0.0"

jobs:
  xtensa:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Installs the Xtensa Rust fork for esp32 and esp32s3 (not the RISC-V or S2 targets).
      # rust-src comes with it, so -Z build-std=core,alloc needs no extra step.
      - name: Install esp toolchain (Xtensa)
        uses: datenkollektiv/rustyfarian-ci/.github/actions/setup-xtensa@v1
        with:
          version: ${{ env.XTENSA_VERSION }}
          buildtargets: esp32,esp32s3

      - name: Setup just
        uses: extractions/setup-just@v4

      # rust-cache sees the default rustc, not the esp toolchain, so the toolchain version is in the key.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: xtensa-${{ env.XTENSA_VERSION }}-${{ hashFiles('.cargo/config.toml') }}

      - name: Check, lint and link the Xtensa esp-hal chips
        run: just ci-xtensa
