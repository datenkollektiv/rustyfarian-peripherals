name: Cross-target RISC-V

# Gates the bare-metal esp-hal tier on both RISC-V chips: ESP32-C3 (riscv32imc, no atomics)
# and ESP32-C6 (riscv32imac, with atomics). `just ci-riscv` runs `check` and `clippy -D warnings`
# on the library for each chip, then links each chip's b3f smoke example (`check` never links).
# Stable toolchain only: RISC-V has a prebuilt core, so no espup and no nightly.
# Path-filtered: only runs when the esp-hal tier, its `tamer` dependency, or the scripts change.

# NOTE: the push and pull_request `paths:` lists below are duplicated and must stay in
# sync. GitHub Actions does not support YAML anchors/aliases, so this cannot be factored out.
on:
  push:
    branches: ["main"]
    paths:
      - "crates/rustyfarian-esp-hal-peripherals/**"
      - "crates/tamer/**"
      - "scripts/**"
      - ".cargo/config.toml"
      - "Cargo.toml"
      - "justfile"
      - ".github/workflows/cross-target-riscv.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "crates/rustyfarian-esp-hal-peripherals/**"
      - "crates/tamer/**"
      - "scripts/**"
      - ".cargo/config.toml"
      - "Cargo.toml"
      - "justfile"
      - ".github/workflows/cross-target-riscv.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-riscv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  riscv:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Stable + clippy, just, and the cargo cache. The recipe runs `rustup target add` for each triple.
      - name: Setup Rust, just and cargo cache
        uses: datenkollektiv/rustyfarian-ci/.github/actions/setup-rust-just@v1
        with:
          toolchain: stable
          components: clippy
          cache-key: riscv-${{ hashFiles('.cargo/config.toml') }}

      - name: Check, lint and link the RISC-V esp-hal chips
        run: just ci-riscv
