[workspace]
resolver = "2"
members = ["crates/*"]
# Device-only firmware package: built for avr-none out of tree, never by the host gates.
exclude = ["examples/avr-nano-tamer"]

[workspace.package]
version = "0.2.0"
authors = ["datenkollektiv"]
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/datenkollektiv/rustyfarian-peripherals"

[workspace.dependencies]
# Workspace-internal crates.
# `version` must track `[workspace.package] version` — `cargo publish` rejects
# path-only dependencies, and the tiers ship in lockstep with `tamer` (see
# `release-plan.md`).
tamer = { path = "crates/tamer", version = "0.2.0", default-features = false }
# Lockstep with the workspace version; published right after tamer (see `release-plan.md`).
# Dev-only for the tiers (the OLED examples).
signwriter = { path = "crates/signwriter", version = "0.2.0" }

# External — pure, host-buildable.
# `embedded-hal` is the trait boundary every hardware tier shares: the pure
# `tamer` logic is fed from `embedded_hal::digital::InputPin` adapters, and the
# device crates implement against the same traits. Kept at a caret range because
# it is pure; the esp-* stacks below are pinned exactly.
embedded-hal = { version = "1.0", default-features = false }
# Pixel/draw-target traits for `signwriter`; `embedded-graphics-core` carries no fonts or shapes.
embedded-graphics-core = { version = "0.4", default-features = false }
# Async twin of `embedded-hal`, behind `tamer`'s opt-in `hal-async` feature
# (ADR-010 rung-3 async runners, for embassy on esp-hal).
embedded-hal-async = { version = "1.0", default-features = false }
nb = { version = "1.1", default-features = false }
# `no_std`/`f32` CORDIC trig (atan2 etc.) for `tamer::tilt`, gated behind the
# `tilt` feature — purpose-built for small no_std code size, not a full libm.
micromath = { version = "2", default-features = false }

# ── Dev-only: OLED examples (both hardware tiers) ───────────────────────────
#
# Referenced only from the tier crates' `[dev-dependencies]` (never from `tamer`
# or a tier's normal `[dependencies]`), so library builds do not pull them in.
# Pure-Rust, `no_std`, MIT OR Apache-2.0; caret ranges like the other pure
# crates above. `embedded-graphics` 0.8 is the current release and matches
# `embedded-graphics-core` 0.4; the panel itself is driven by `signwriter`.
embedded-graphics = { version = "0.8" }

# ── Hardware-tier dependencies ───────────────────────────────────────────────
#
# Pinned exactly (`=`), not with carets: the esp-hal and esp-idf ecosystems
# release as coordinated waves, and mixed minors produce feature-unification
# conflicts. Re-use the same wave the sibling repos are on — see the
# `[workspace.dependencies]` tables and rationale comments in rustyfarian-ws2812
# and rustyfarian-network.
#
# Bumps land via the maintenance cycle (see `maintenance-plan.md`), not by
# transparent fresh-resolution drift.
#
# Bare-metal (esp-hal) tier — September 2026 wave. esp-hal 1.2 and its
# companions declare `rust-version = "1.95.0"`, which is why the hal tier crate
# sets its own `rust-version` above the workspace floor.
esp-hal                = { version = "=1.2.2" }
esp-bootloader-esp-idf = { version = "=0.6.0", default-features = false }
esp-println            = { version = "=0.18.0", default-features = false }

# Bare-metal async runtime (esp-rtos/embassy) — example-only, same wave as
# siblings (rustyfarian-ws2812, rustyfarian-network), move together with esp-hal.
esp-rtos           = { version = "=0.4.0", default-features = false }
embassy-executor   = { version = "=0.10.0", default-features = false }
embassy-time       = { version = "=0.5.1", default-features = false }
embassy-futures    = { version = "=0.1.2", default-features = false }

# ESP-IDF (std) tier — esp-idf-hal 0.47 requires esp-idf-sys 0.38 and
# embuild >= 0.33.5; esp-idf-svc 0.53 requires esp-idf-hal 0.47. Move all four
# together. (esp-idf-sys 0.38.0 is yanked upstream — stay on 0.38.1.)
esp-idf-hal  = { version = "=0.47.0" }
esp-idf-svc  = { version = "=0.53.0" }
esp-idf-sys  = { version = "=0.38.1" }
embuild      = { version = "=0.33.5", features = ["espidf"] }
# Exact: the esp-hal tier's rotary ISR relies on esp-hal's ISR-safe
# `critical-section` impl (interrupt mask + spinlock). The ESP-IDF provider is a
# FreeRTOS mutex and NOT ISR-safe; see docs/project-lore.md.
critical-section = { version = "=1.2.0" }
log         = { version = "0.4" }
anyhow      = { version = "1.0" }
